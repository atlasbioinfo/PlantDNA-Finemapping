# GPU environment: everything in environment.yml plus the attention step (PyTorch with CUDA, transformers).
#   conda env create -f environment-gpu.yml && conda activate plantdna-finemap-gpu
# If your CUDA driver needs another PyTorch build, install PyTorch first (https://pytorch.org/get-started/locally/).
name: plantdna-finemap-gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - ".[attention]"
